<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Qimah Profile</title>

    <meta property="og:title" content="Qimah Profile">



    <style>

        /* Modern Dark Green Theme */

        body {

            margin: 0;

            padding: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            background-color: #0a1f14; /* Deep Dark Green */

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            color: #ffffff;

            overflow: hidden;

        }



        .loader-container {

            text-align: center;

        }



        /* The Spinner */

        .spinner {

            width: 50px;

            height: 50px;

            border: 5px solid rgba(255, 255, 255, 0.1);

            border-top: 5px solid #2ecc71; /* Vibrant Green accent */

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: 0 auto 20px;

        }



        @keyframes spin {

            0% { transform: rotate(0deg); }

            100% { transform: rotate(360deg); }

        }



        .text {

            font-size: 1.2rem;

            letter-spacing: 1px;

            opacity: 0.8;

        }

    </style>

</head>

<body>



    <div class="loader-container">

        <div class="spinner"></div>

        <div class="text">QIMAH</div>

    </div>



    <script>

        // Wait for 1000ms (1 second) then redirect

        setTimeout(function() {

            window.location.replace("https://qimahgroup.com");

        }, 1000);

    </script>



</body>

</html>
